name: Sophia Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sophia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preservar assinatura debug Sophia
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sophia-debug-signing-v1
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Wrapper, testes e compilação
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          ./gradlew :domain:test :app:assembleDebug :app:lintDebug :data:lintDebug --stacktrace
      - name: Preparar APK e verificações
        run: |
          mkdir -p distribution
          cp app/build/outputs/apk/debug/app-debug.apk distribution/Sophia-v0.1.0-debug.apk
          cd distribution
          sha256sum Sophia-v0.1.0-debug.apk > SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Sophia-v0.1.0-debug.apk > assinatura.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sophia-apk
          path: distribution/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sophia-build-reports
          path: |
            domain/build/test-results/
            app/build/reports/
            data/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: sophia-wrapper-schema
          include-hidden-files: true
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
            data/schemas/
  android-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            gradle :data:connectedDebugAndroidTest :app:connectedDebugAndroidTest --stacktrace
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.sophia.enciclopedia/files/. screenshots/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sophia-device-tests
          path: |
            data/build/outputs/androidTest-results/
            app/build/outputs/androidTest-results/
            data/build/reports/androidTests/
            app/build/reports/androidTests/
            screenshots/
  release:
    needs: [build, android-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sophia-apk
          path: distribution
      - name: Publicar APK após testes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create sophia-v0.1.0 distribution/* --target "$GITHUB_SHA" --prerelease --title 'Sophia v0.1.0 — Fase 1' --notes 'Primeira versão offline: catálogo bibliográfico, pesquisa de metadados, favoritos, notas e tema persistentes. Assistente IA explicitamente em desenvolvimento. Sem livros integrais ou ficheiros incluídos. APK debug assinado, Android 8.0 ou superior. Consulte README e documentação de testes no repositório. Publicação condicionada a testes unitários, Android e lint.'
